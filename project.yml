name: PhonePointer
options:
  bundleIdPrefix: com.yuuyuu86
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PhonePointer:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PhonePointer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 同じWi-Fi内のMacを探して操作データを送るために使用します。
        NSBonjourServices: [_phonepointer._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuuyuu86.PhonePointer
        TARGETED_DEVICE_FAMILY: "1"
  PhonePointerMac:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: PhonePointer
        LSUIElement: true
        NSLocalNetworkUsageDescription: iPhoneからの接続を受け付けるために使用します。
        NSBonjourServices: [_phonepointer._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuuyuu86.PhonePointerMac
        PRODUCT_NAME: PhonePointer Mac
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
